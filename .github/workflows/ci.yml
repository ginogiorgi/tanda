name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Knip (código/deps muertos)
        run: pnpm knip

      - name: Catálogo (preguntas + equipos)
        run: pnpm catalog:check
      - name: Migraciones (nombres, versiones únicas, nuevas > main)
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main && pnpm db:check-migrations
      - name: Assets de public/ (sin huérfanos ni links rotos)
        run: pnpm assets:check

      - name: Preguntas (duplicados, temas, balance)
        run: pnpm questions:check

      - name: Test
        run: pnpm test

      - name: Test de componentes (React Testing Library)
        run: pnpm test:components

      - name: Build
        run: pnpm build

      - name: Presupuesto de JS por ruta (sin three en las entradas)
        run: pnpm perf:budget

  # Camino autoritativo SQL/RPC contra el Postgres local de Supabase (9.0): paridad TS↔SQL,
  # anti-trampa, e2e de torneo, reloj de ronda y abandon. Atrapa migraciones rotas antes del merge.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (solo DB)
        run: pnpm db:start

      - name: Aplicar migraciones desde archivos
        run: pnpm db:reset

      - name: Tipos generados al día (database.generated.ts = DB de las migraciones)
        run: pnpm db:types && git diff --exit-code lib/supabase/database.generated.ts

      - name: DB tests (SQL/RPC)
        run: pnpm test:db

  # Flujo de juego real en el navegador (invitado → sala → partido; ranked 1v1) contra el Supabase
  # LOCAL del runner (auth anónima + realtime + pg_cron). `flow.sh` toma URL/keys de `supabase status`
  # y aborta si la API no es local. Usa el Chrome preinstalado del runner (channel "chrome").
  e2e-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start Supabase (auth + realtime + cron)
        run: pnpm e2e:stack

      - name: Aplicar migraciones desde archivos
        run: pnpm db:reset

      - name: E2E de flujo (local)
        run: pnpm test:e2e:flow

      # Smoke + layout + axe de las páginas públicas (feedback 4: antes no corría en CI). Reusa el build
      # local que dejó el paso anterior; flow.sh verifica que apunte a la API local.
      - name: E2E smoke + axe (local)
        run: E2E_SKIP_BUILD=1 E2E_CONFIG=playwright.config.ts bash scripts/e2e/flow.sh

      - name: Trazas de Playwright (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flow-traces
          path: test-results/
          retention-days: 7
